<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f5f5;
        }

        .login-box{
            width:400px;
            margin:80px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
        }
    </style>

</head>
<body>

<div class="login-box">

    <h2 class="text-center mb-4">Đăng Nhập</h2>

    <form th:action="@{/login}" method="post">

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   name="username"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Mật khẩu</label>
            <input type="password"
                   name="password"
                   class="form-control"
                   required>
        </div>

        <button class="btn btn-primary w-100">
            Đăng nhập
        </button>

    </form>

    <div class="text-center mt-3">
        Chưa có tài khoản?
        <a th:href="@{/register}">
            Đăng ký
        </a>
    </div>

</div>

</body>
</html>
