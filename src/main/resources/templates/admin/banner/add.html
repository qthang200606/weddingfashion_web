<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu Hình Banner - Admin Bella Couture</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sidebar-width: 260px; --sidebar-collapsed-width: 75px;
            --topbar-height: 70px; --footer-height: 60px;
            --gold-color: #d4af37; --dark-color: #111111;
            --light-bg: #f8f9fc; --border-color: #eef2f6;
        }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--light-bg); color: #333; margin: 0; }

        .topbar.expanded { left: var(--sidebar-collapsed-width); }
        .main-wrapper { margin-left: var(--sidebar-width); padding-top: var(--topbar-height); min-height: 100vh; display: flex; flex-direction: column; transition: margin-left 0.3s ease; }
        .main-wrapper.expanded { margin-left: var(--sidebar-collapsed-width); }
        .content-area { flex-grow: 1; padding: 35px 30px; }

        .page-title { font-family: 'Playfair Display', serif; font-weight: 700; color: #111; margin: 0; font-size: 1.7rem; }
        .breadcrumb-custom { font-size: 0.85rem; color: #8a8a8a; margin-top: 4px; }
        .custom-card { background: #fff; border: none; border-radius: 16px; box-shadow: 0 4px 18px rgba(0,0,0,0.02); padding: 25px; margin-bottom: 25px; }
        .uppercase { text-transform: uppercase; }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar(pageTitle='banner')}"></div>
<nav th:replace="~{admin/fragments/header :: header}"></nav>

<div class="main-wrapper" id="mainWrapper">
    <div class="content-area">

        <div class="mb-4">
            <a th:href="@{/admin/banners}" class="text-decoration-none text-muted small">
                <i class="fa-solid fa-arrow-left-long me-2"></i> Quay lại danh sách banner
            </a>
            <h2 class="page-title mt-2">Cấu Hình Thông Tin Banner</h2>
            <div class="breadcrumb-custom">Hệ thống / Thiết lập chi tiết ảnh hiển thị trang chủ</div>
        </div>

        <div class="custom-card shadow-sm" style="max-width: 850px; margin: 0 auto;">
            <form th:action="@{/admin/banners/save}" th:object="${banner}" method="POST">
                <input type="hidden" th:field="*{bannerId}">

                <div class="row g-4">
                    <div class="col-md-12">
                        <label class="form-label font-monospace text-muted small uppercase fw-bold">Tiêu đề phụ (Tên BST / Khuyến mãi)</label>
                        <input type="text" class="form-control py-2" style="border-radius: 8px;" th:field="*{title}" placeholder="Ví dụ: BST MÙA CƯỚI HOÀNG GIA 2026" required>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label font-monospace text-muted small fw-bold">Đường dẫn hình ảnh (URL Image)</label>
                        <input type="url" class="form-control py-2" style="border-radius: 8px;" th:field="*{imageUrl}" id="imageUrlInput" placeholder="https://images.unsplash.com/..." required>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label font-monospace text-muted small fw-bold">Nội dung thông điệp chính</label>
                        <textarea class="form-control" style="border-radius: 8px;" th:field="*{content}" rows="3" placeholder="Ví dụ: Ưu đãi đồng giá toàn bộ váy cưới..." required></textarea>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label font-monospace text-muted small fw-bold">Ngày bắt đầu hiển thị</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white" style="border-radius: 8px 0 0 8px;"><i class="fa-regular fa-calendar text-muted"></i></span>
                            <input type="date" class="form-control py-2" style="border-radius: 0 8px 8px 0;" th:field="*{startDate}" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label font-monospace text-muted small fw-bold">Ngày kết thúc chiến dịch</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white" style="border-radius: 8px 0 0 8px;"><i class="fa-regular fa-calendar-times text-muted"></i></span>
                            <input type="date" class="form-control py-2" style="border-radius: 0 8px 8px 0;" th:field="*{endDate}" required>
                        </div>
                    </div>

                    <div class="col-md-12">
                        <label class="form-label font-monospace text-muted small fw-bold">Trạng thái phát hành</label>
                        <select class="form-select py-2" style="border-radius: 8px;" th:field="*{status}">
                            <option value="ACTIVE">Kích hoạt</option>
                            <option value="INACTIVE">Tạm ẩn</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4 pt-4 border-top d-flex justify-content-end gap-2">
                    <a th:href="@{/admin/banners}" class="btn btn-light px-4 py-2" style="border-radius: 8px;">Hủy Bỏ</a>
                    <button type="submit" class="btn btn-dark px-4 py-2" style="border-radius: 8px; background-color: var(--dark-color)">
                        <i class="fa-solid fa-cloud-arrow-up me-2"></i> LƯU THAY ĐỔI
                    </button>
                </div>
            </form>
        </div>
    </div>
    <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const sidebarToggle = document.getElementById('sidebarToggle');
    const sidebar = document.getElementById('sidebar');
    const topbar = document.getElementById('topbar');
    const mainWrapper = document.getElementById('mainWrapper');

    if(sidebarToggle) {
        sidebarToggle.addEventListener('click', () => {
            if (window.innerWidth > 991.98) {
                sidebar.classList.toggle('collapsed');
                if(topbar) topbar.classList.toggle('expanded');
                mainWrapper.classList.toggle('expanded');
            } else {
                sidebar.classList.toggle('mobile-open');
            }
        });
    }
</script>
</body>
</html>
