<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Bridal Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style th:replace="~{admin/category/list :: shared-styles}"></style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar}"></div>

<nav th:replace="~{admin/fragments/header :: header}"></nav>

<div class="main-wrapper" id="mainWrapper">
    <div class="content-area">

        <div class="page-header">
            <h2 class="page-title">Dashboard Tổng Quan</h2>
            <div class="breadcrumb-custom">Tổng quan hệ thống / Hoạt động kinh doanh</div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="stat-card">
                    <div class="stat-info">
                        <h6>Tổng sản phẩm</h6>
                        <h3 th:text="${totalProducts != null ? totalProducts : '120'}">120</h3>
                    </div>
                    <div class="stat-icon icon-gold"><i class="fa-solid fa-shirt"></i></div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="stat-card">
                    <div class="stat-info">
                        <h6>Đơn hàng</h6>
                        <h3 th:text="${totalOrders != null ? totalOrders : '50'}">50</h3>
                    </div>
                    <div class="stat-icon icon-rose"><i class="fa-solid fa-bag-shopping"></i></div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="stat-card">
                    <div class="stat-info">
                        <h6>Doanh thu</h6>
                        <h3 th:text="${totalRevenue != null ? totalRevenue : '120M'}">120M</h3>
                    </div>
                    <div class="stat-icon icon-blue"><i class="fa-solid fa-wallet"></i></div>
                </div>
            </div>
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="stat-card">
                    <div class="stat-info">
                        <h6>Lịch hẹn hôm nay</h6>
                        <h3 th:text="${totalAppointments != null ? totalAppointments : '15'}">15</h3>
                    </div>
                    <div class="stat-icon icon-purple"><i class="fa-solid fa-calendar-days"></i></div>
                </div>
            </div>
        </div>

        <div class="custom-card mt-4">
            <h5 class="card-header-title mb-4"><i class="fa-solid fa-bolt text-warning me-2"></i>Truy cập nhanh tác vụ</h5>
            <div class="row g-3">
                <div class="col-12 col-md-3">
                    <a th:href="@{/admin/products}" class="quick-action-btn">
                        <span><i class="fa-solid fa-square-plus text-primary me-2"></i> Quản lý sản phẩm</span>
                        <i class="fa-solid fa-arrow-right-long opacity-50"></i>
                    </a>
                </div>
                <div class="col-12 col-md-3">
                    <a href="#" class="quick-action-btn">
                        <span><i class="fa-solid fa-cart-check text-success Holiday me-2"></i> Quản lý đơn hàng</span>
                        <i class="fa-solid fa-arrow-right-long opacity-50"></i>
                    </a>
                </div>
                <div class="col-12 col-md-3">
                    <a href="#" class="quick-action-btn">
                        <span><i class="fa-solid fa-calendar-days text-warning me-2"></i> Lịch hẹn khách thử váy</span>
                        <i class="fa-solid fa-arrow-right-long opacity-50"></i>
                    </a>
                </div>
                <div class="col-12 col-md-3">
                    <a href="#" class="quick-action-btn">
                        <span><i class="fa-solid fa-images text-info me-2"></i> Cấu hình banner quảng cáo</span>
                        <i class="fa-solid fa-arrow-right-long opacity-50"></i>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:replace="~{admin/category/list :: shared-scripts}"></script>
</body>
</html>
