

<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Sản Phẩm</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background:#f8f9fa;
        }

        .card-form{
            max-width:900px;
            margin:40px auto;
            border:none;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        .card-header{
            background:#ffcad4;
            color:#333;
            font-weight:bold;
            font-size:22px;
            text-align:center;
        }

        .preview-img{
            width:180px;
            height:180px;
            object-fit:cover;
            border-radius:10px;
            border:1px solid #ddd;
            margin-top:10px;
        }

    </style>

</head>
<body>

<div class="container">

    <div class="card card-form">

        <div class="card-header">
            Thêm / Cập Nhật Sản Phẩm
        </div>

        <div class="card-body">

            <form th:action="@{/admin/products/save}"
                  th:object="${product}"
                  method="post"
                  enctype="multipart/form-data">

                <input type="hidden"
                       th:field="*{productId}">

                <div class="row">

                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label">
                                Tên sản phẩm
                            </label>

                            <input type="text"
                                   th:field="*{productName}"
                                   class="form-control"
                                   placeholder="Nhập tên sản phẩm">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label">
                                Giá bán
                            </label>

                            <input type="number"
                                   th:field="*{price}"
                                   class="form-control">
                        </div>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label">
                                Số lượng tồn
                            </label>

                            <input type="number"
                                   th:field="*{stockQuantity}"
                                   class="form-control">
                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="mb-3">
                            <label class="form-label">
                                Danh mục
                            </label>

                            <select th:field="*{category}"
                                    class="form-select">

                                <option value="">
                                    -- Chọn danh mục --
                                </option>

                                <option th:each="c : ${categories}"
                                        th:value="${c.categoryId}"
                                        th:text="${c.categoryName}">
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Mô tả sản phẩm
                    </label>

                    <textarea th:field="*{description}"
                              rows="5"
                              class="form-control">
                    </textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Hình ảnh sản phẩm
                    </label>

                    <input type="file"
                           name="file"
                           class="form-control"
                           onchange="previewImage(event)">

                    <img id="preview"
                         class="preview-img"
                         style="display:none;">

                </div>

                <div class="text-center">

                    <button type="submit"
                            class="btn btn-success px-4">
                        Lưu sản phẩm
                    </button>

                    <a th:href="@{/admin/products}"
                       class="btn btn-secondary px-4">
                        Quay lại
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script>

    function previewImage(event){

        let image = document.getElementById("preview");

        image.src = URL.createObjectURL(
            event.target.files[0]
        );

        image.style.display="block";
    }

</script>

</body>
</html>
