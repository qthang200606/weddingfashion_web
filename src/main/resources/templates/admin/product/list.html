<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm - Bridal Studio</title>

    <!-- Core Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Hệ thống CSS -->
    <link th:href="@{/css/admin/style.css}" rel="stylesheet">
    <link th:href="@{/css/admin/product.css}" rel="stylesheet">

    <style>
        /* CSS Xem trước ảnh từ form của bạn */
        .preview-img {
            width: 140px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-top: 10px;
            display: none; /* Mặc định ẩn, có ảnh mới hiện */
        }
        .modal-header-bridal {
            background: #ffcad4; /* Màu hồng cam đặc trưng từ form của bạn */
            color: #333;
        }
    </style>
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar(pageTitle='product')}"></div>
<nav th:replace="~{admin/fragments/header :: header}"></nav>

<div class="main-wrapper" id="mainWrapper">
    <div class="content-area">

        <!-- TIÊU ĐỀ VÀ NÚT THÊM -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="page-title">Quản Lý Sản Phẩm</h2>
                <div class="breadcrumb-custom">Hệ thống / Kho váy cưới & BST thiết kế</div>
            </div>
            <button id="openAddProductBtn" class="btn-gold-action">
                <i class="fa-solid fa-square-plus me-1"></i> Thêm sản phẩm
            </button>
        </div>

        <!-- BẢNG DANH SÁCH -->
        <div class="custom-card shadow-sm">
            <div class="table-responsive">
                <table class="table table-borderless table-bridal align-middle m-0">
                    <thead>
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th style="width: 100px;">Hình ảnh</th>
                        <th>Tên sản phẩm</th>
                        <th>Danh mục</th>
                        <th>Giá bán / Thuê</th>
                        <th>Trạng thái kho</th>
                        <th style="width: 160px;" class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="p : ${products}">
                        <td class="fw-bold text-secondary" th:text="${p.productId}">#1</td>
                        <td>
                            <div class="product-image-container">
                                <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://images.unsplash.com/photo-1594552072238-b8a33785b261?auto=format&fit=crop&w=150&q=80'}" alt="Váy cưới">
                            </div>
                        </td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${p.productName}">Váy Cưới Luxury Satin Swan</div>
                            <small class="text-muted" style="font-size: 0.75rem;">Mã sản phẩm: <span th:text="'BR-' + ${p.productId}">BR-01</span></small>
                        </td>
                        <td>
                            <span class="badge bg-light text-dark border px-2.5 py-1.5" style="border-radius: 6px; font-weight: 500;"
                                  th:text="${p.category != null ? p.category.categoryName : 'Chưa phân loại'}">Váy Cưới</span>
                        </td>
                        <td>
                            <span class="price-text">
                                <span th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')}">15,000,000</span>
                                <span class="price-currency">VNĐ</span>
                            </span>
                        </td>
                        <td>
                            <span th:if="${p.stockQuantity > 10}" class="badge-stock stock-high">
                                <i class="fa-solid fa-circle-check small"></i> Còn hàng (<span th:text="${p.stockQuantity}">12</span>)
                            </span>
                            <span th:if="${p.stockQuantity <= 10 and p.stockQuantity > 0}" class="badge-stock stock-low">
                                <i class="fa-solid fa-triangle-exclamation small"></i> Sắp hết (<span th:text="${p.stockQuantity}">5</span>)
                            </span>
                            <span th:if="${p.stockQuantity == 0}" class="badge-stock stock-empty">
                                <i class="fa-solid fa-circle-xmark small"></i> Hết hàng
                            </span>
                        </td>
                        <td class="text-center">
                            <div class="d-inline-flex gap-1">
                                <!-- Nút sửa kích hoạt Popup động -->
                                <button type="button" th:data-id="${p.productId}"
                                        class="btn btn-sm btn-action-edit btn-trigger-edit-product px-2.5" title="Chỉnh sửa">
                                    <i class="fa-regular fa-pen-to-square"></i> Sửa
                                </button>
                                <a th:href="@{/admin/products/delete/{id}(id=${p.productId})}"
                                   class="btn btn-sm btn-outline-danger px-2.5"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm váy cưới này?')" title="Xóa bỏ">
                                    <i class="fa-regular fa-trash-can"></i> Xóa
                                </a>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-inbox d-block fs-2 mb-2 opacity-40"></i> Hiện tại chưa có sản phẩm nào.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>

    </div>
    <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</div>

<!-- ==========================================================================
   MODAL POPUP THÊM / CẬP NHẬT SẢN PHẨM (TÍCH HỢP FORM CỦA BẠN)
   ========================================================================== -->
<div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow">

            <!-- Sử dụng Form của bạn có Multipart hỗ trợ tải file ảnh -->
            <form id="productForm" method="post" enctype="multipart/form-data">

                <div class="modal-header modal-header-bridal px-4 py-3">
                    <h5 class="modal-title fw-bold fs-5" id="productModalTitle">Thêm / Cập Nhật Sản Phẩm</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body p-4">
                    <!-- Input ẩn chứa ID khi cập nhật -->
                    <input type="hidden" id="formProductId" name="productId">

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold small">Tên sản phẩm</label>
                            <input type="text" id="formProductName" name="productName" class="form-control" placeholder="Nhập tên sản phẩm" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold small">Giá bán (VNĐ)</label>
                            <input type="number" id="formPrice" name="price" class="form-control" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold small">Số lượng tồn</label>
                            <input type="number" id="formStockQuantity" name="stockQuantity" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-semibold small">Danh mục</label>
                            <select id="formCategory" name="category" class="form-select" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="c : ${categories}"
                                        th:value="${c.categoryId}"
                                        th:text="${c.categoryName}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Mô tả sản phẩm</label>
                        <textarea id="formDescription" name="description" rows="4" class="form-control" placeholder="Nhập thông tin mô tả chi tiết sản phẩm..."></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Hình ảnh sản phẩm</label>
                        <input type="file" name="file" class="form-control" id="formFile" onchange="previewImage(event)">

                        <!-- Khung Preview Ảnh tương tác -->
                        <div class="mt-2">
                            <img id="preview" class="preview-img" alt="Xem trước ảnh">
                        </div>
                    </div>
                </div>

                <div class="modal-footer bg-light px-4 py-3">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Hủy bỏ</button>
                    <button type="submit" class="btn btn-success px-4">Lưu sản phẩm</button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Thư viện và Tệp điều khiển JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/product-action.js(v='1.2')}"></script>

<script>
    // Hàm xử lý Preview ảnh động của bạn
    function previewImage(event){
        const image = document.getElementById("preview");
        if(event.target.files && event.target.files[0]) {
            image.src = URL.createObjectURL(event.target.files[0]);
            image.style.display = "block";
        }
    }
</script>
</body>
</html>
