<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Mục - Bridal Studio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link th:href="@{/css/admin/style.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{admin/fragments/sidebar :: sidebar(pageTitle='category')}"></div>
<nav th:replace="~{admin/fragments/header :: header}"></nav>

<div class="main-wrapper" id="mainWrapper">
    <div class="content-area">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="page-title">Quản Lý Danh Mục</h2>
                <div class="breadcrumb-custom">Hệ thống / Phân loại váy cưới & phụ kiện Studio</div>
            </div>
            <button id="openAddCategoryBtn" class="btn-gold-action">
                <i class="fa-solid fa-square-plus"></i> Thêm danh mục mới
            </button>
        </div>

        <div class="custom-card shadow-sm">
            <div class="table-responsive">
                <table class="table table-borderless table-bridal align-middle m-0">
                    <thead>
                    <tr>
                        <th style="width: 80px;">ID</th>
                        <th style="width: 280px;">Tên danh mục</th>
                        <th>Mô tả chi tiết</th>
                        <th style="width: 160px;" class="text-center">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>

                    <tr th:each="category : ${categories}">
                        <td>
                            <span class="fw-bold text-secondary" th:text="${category.categoryId}">1</span>
                        </td>
                        <td>
                            <div class="fw-bold text-dark" th:text="${category.categoryName}">Váy Cưới Đuôi Cá</div>
                        </td>
                        <td>
                            <span class="text-muted" th:text="${category.description}">Mô tả mẫu danh mục</span>
                        </td>
                        <td class="text-center">
                            <div class="d-inline-flex gap-1">
                                <button type="button" th:data-id="${category.categoryId}"
                                        class="btn btn-sm btn-action-edit btn-trigger-edit-category px-2.5" title="Chỉnh sửa">
                                    <i class="fa-regular fa-pen-to-square"></i> Sửa
                                </button>
                                <a th:href="@{/admin/categories/delete/{id}(id=${category.categoryId})}"
                                   class="btn btn-sm btn-outline-danger px-2.5"
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?')" title="Xóa bỏ">
                                    <i class="fa-regular fa-trash-can"></i> Xóa
                                </a>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="4" class="text-center py-5 text-muted">
                            <i class="fa-solid fa-folder-open d-block fs-2 mb-2 opacity-40"></i>
                            Hiện tại chưa có phân loại danh mục nào trong hệ thống.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <footer th:replace="~{admin/fragments/footer :: footer}"></footer>
</div>

<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">

            <form id="categoryForm" method="post">

                <div class="modal-header px-4 py-3" style="background: #ffcad4; color: #333;">
                    <h5 class="modal-title fw-bold fs-5" id="categoryModalTitle">Danh Mục</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body p-4">
                    <input type="hidden" id="formCategoryId" name="categoryId">

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Tên danh mục</label>
                        <input type="text" id="formCategoryName" name="categoryName" class="form-control" placeholder="Nhập tên danh mục" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Mô tả</label>
                        <textarea id="formDescription" name="description" rows="4" class="form-control" placeholder="Nhập mô tả đặc tính..."></textarea>
                    </div>
                </div>

                <div class="modal-footer bg-light px-4 py-3">
                    <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Quay lại</button>
                    <button type="submit" class="btn btn-primary px-4">Lưu</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin/sidebar.js}"></script>
<script th:src="@{/js/admin/category-action.js}"></script>
</body>
</html>
