<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f5f5;
        }

        .register-box{
            width:500px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
        }

    </style>

</head>
<body>

<div class="register-box">

    <h2 class="text-center mb-4">
        Đăng Ký Tài Khoản
    </h2>

    <form th:action="@{/register}"
          th:object="${user}"
          method="post">

        <div class="mb-3">
            <label>Họ tên</label>
            <input type="text"
                   th:field="*{fullName}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input type="email"
                   th:field="*{email}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Mật khẩu</label>
            <input type="password"
                   th:field="*{password}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Số điện thoại</label>
            <input type="text"
                   th:field="*{phone}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Địa chỉ</label>
            <textarea th:field="*{address}"
                      class="form-control"></textarea>
        </div>

        <button class="btn btn-success w-100">
            Đăng ký
        </button>

    </form>

    <div class="text-center mt-3">
        Đã có tài khoản?
        <a th:href="@{/login}">
            Đăng nhập
        </a>
    </div>

</div>

</body>
</html>
