<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Tiến Độ Đơn Hàng | Bridal Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfbfa; }
        .luxury-card { background: #fff; border: 1px solid #f2eee9; border-radius: 16px; padding: 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.01); }

        /* Timeline */
        .timeline-container { position: relative; display: flex; justify-content: space-between; align-items: center; margin: 40px 0; }
        .timeline-line { position: absolute; top: 25px; left: 4%; right: 4%; height: 3px; background-color: #e2e8f0; z-index: 1; }
        .timeline-progress { position: absolute; top: 25px; left: 4%; height: 3px; background-color: #b89772; z-index: 2; transition: width 0.5s ease; }

        .timeline-step { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; width: 18%; }
        .step-icon { width: 52px; height: 52px; border-radius: 50%; background-color: #fff; border: 3px solid #e2e8f0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; color: #a0aec0; }
        .step-text { margin-top: 12px; font-size: 0.8rem; font-weight: 600; color: #718096; text-transform: uppercase; }

        .timeline-step.active .step-icon { border-color: #b89772; background-color: #b89772; color: #fff; box-shadow: 0 0 15px rgba(184,151,114,0.3); }
        .timeline-step.active .step-text { color: #111; font-weight: 700; }

        /* Đánh giá ngôi sao */
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 6px; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 2rem; color: #e2e8f0; cursor: pointer; }
        .star-rating input:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label { color: #d4af37; }

        .btn-luxury { background-color: #111; color: #fff; border: 1px solid #111; font-weight: 500; padding: 10px 24px; border-radius: 8px; text-decoration: none; }
        .btn-luxury:hover { background-color: #b89772; border-color: #b89772; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">

            <div class="mb-4">
                <a href="/customer/orders/history" class="text-decoration-none text-muted small"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách</a>
            </div>

            <!-- TIẾN ĐỘ THỜI GIAN THỰC -->
            <div class="luxury-card mb-4">
                <h5 class="fw-bold mb-1" style="font-family: 'Playfair Display', serif;">Hành trình đơn hàng #<span th:text="${order.paymentCode}">DH9081</span></h5>

                <div class="timeline-container">
                    <div class="timeline-line"></div>
                    <div class="timeline-progress" th:style="${
                        order.status == 'PENDING' ? 'width: 0%' :
                        (order.status == 'CONFIRMED' ? 'width: 25%' :
                        (order.status == 'PREPARING' ? 'width: 50%' :
                        (order.status == 'SHIPPING' ? 'width: 75%' : 'width: 100%')))}">
                    </div>

                    <div class="timeline-step" th:classappend="${order.status != 'CANCELLED'} ? 'active'">
                        <div class="step-icon"><i class="fa-solid fa-receipt"></i></div>
                        <div class="step-text">Đặt đơn</div>
                    </div>
                    <div class="timeline-step" th:classappend="${order.status == 'CONFIRMED' || order.status == 'PREPARING' || order.status == 'SHIPPING' || order.status == 'DELIVERED'} ? 'active'">
                        <div class="step-icon"><i class="fa-solid fa-calendar-check"></i></div>
                        <div class="step-text">Đã duyệt</div>
                    </div>
                    <div class="timeline-step" th:classappend="${order.status == 'PREPARING' || order.status == 'SHIPPING' || order.status == 'DELIVERED'} ? 'active'">
                        <div class="step-icon"><i class="fa-solid fa-box-open"></i></div>
                        <div class="step-text">Chuẩn bị</div>
                    </div>
                    <div class="timeline-step" th:classappend="${order.status == 'SHIPPING' || order.status == 'DELIVERED'} ? 'active'">
                        <div class="step-icon"><i class="fa-solid fa-truck-fast"></i></div>
                        <div class="step-text">Đang giao</div>
                    </div>
                    <div class="timeline-step" th:classappend="${order.status == 'DELIVERED'} ? 'active'">
                        <div class="step-icon"><i class="fa-solid fa-heart-circle-check"></i></div>
                        <div class="step-text">Thành công</div>
                    </div>
                </div>
            </div>

            <!-- THÔNG TIN CHI TIẾT ĐƠN -->
            <div class="luxury-card mb-4">
                <div class="row">
                    <div class="col-md-6 border-end">
                        <h6 class="text-muted small fw-bold text-uppercase mb-3">Thông tin nhận hàng</h6>
                        <p class="mb-1 text-dark fw-bold" th:text="${order.receiverName}">Nguyễn Văn A</p>
                        <p class="mb-0 text-muted small" th:text="${order.shippingAddress}">Địa chỉ nhận đồ...</p>
                    </div>
                    <div class="col-md-6 ps-md-4">
                        <h6 class="text-muted small fw-bold text-uppercase mb-3">Tổng giá trị thanh toán</h6>
                        <p class="fs-5 fw-bold" style="color: #b89772;" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</p>
                    </div>
                </div>
            </div>

            <!-- ĐÁNH GIÁ (Chỉ bật lên khi đơn hàng đã thành công) -->
            <div th:if="${order.status == 'DELIVERED'}" class="luxury-card" style="border: 1px solid #d4af37; background: #fffdf9;">
                <div class="text-center mb-4">
                    <h4 style="font-family: 'Playfair Display', serif; font-weight: 700;">Đánh Giá Trải Nghiệm</h4>
                    <p class="text-muted small">Mỗi lời góp ý của bạn sẽ giúp Studio ngày càng hoàn thiện dịch vụ tốt hơn.</p>
                </div>

                <form th:action="@{/customer/orders/submit-review}" method="POST" class="row justify-content-center">
                    <input type="hidden" name="orderId" th:value="${order.orderId}">
                    <div class="col-md-8">
                        <div class="mb-3 d-flex flex-column align-items-center">
                            <div class="star-rating">
                                <input type="radio" id="star5" name="rating" value="5" checked/><label for="star5"><i class="fa-solid fa-star"></i></label>
                                <input type="radio" id="star4" name="rating" value="4"/><label for="star4"><i class="fa-solid fa-star"></i></label>
                                <input type="radio" id="star3" name="rating" value="3"/><label for="star3"><i class="fa-solid fa-star"></i></label>
                                <input type="radio" id="star2" name="rating" value="2"/><label for="star2"><i class="fa-solid fa-star"></i></label>
                                <input type="radio" id="star1" name="rating" value="1"/><label for="star1"><i class="fa-solid fa-star"></i></label>
                            </div>
                        </div>
                        <div class="mb-4">
                            <textarea name="comment" class="form-control p-3" rows="3" placeholder="Chia sẻ trải nghiệm của bạn về dịch vụ/sản phẩm tại đây..." required></textarea>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn-luxury px-5">Gửi đánh giá</button>
                        </div>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>

</body>
</html>
