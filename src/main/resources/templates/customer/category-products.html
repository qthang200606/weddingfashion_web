<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${currentCategory.categoryName} + ' - Bella Couture'">Sản phẩm - Bella Couture</title>
    <!-- Thư viện lõi hệ thống -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Liên kết file CSS dùng chung của hệ thống Layout -->
    <link th:href="@{/css/layout.css}" rel="stylesheet">
    <!-- Liên kết file CSS riêng biệt vừa được tách -->
    <link th:href="@{/css/category-products.css}" rel="stylesheet">

    <style>
        /* CSS cho thông báo Toast nổi ở góc màn hình */
        .bella-toast {
            position: fixed;
            top: 30px;
            right: 30px;
            background: #1a1a1a;
            color: #fff;
            padding: 12px 24px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            border-left: 4px solid #c5a880;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 10000;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.4s ease;
            pointer-events: none;
        }
        .bella-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<!-- Giao diện hộp thông báo ẩn (Toast) -->
<div id="bellaCartToast" class="bella-toast">
    <i class="fa-solid fa-circle-check" style="color: #c5a880;"></i>
    <span>Thêm vào giỏ hàng thành công! ✨</span>
</div>

<!-- Nhúng Thanh Điều Hướng chung -->
<div th:replace="~{customer/fragments/layout :: customer-navbar}"></div>

<!-- Thanh điều hướng đường dẫn & Tiêu đề danh mục hiện tại -->
<div class="container mt-4">
    <nav style="--bs-breadcrumb-divider: '›';" aria-label="breadcrumb">
        <ol class="breadcrumb mb-2 fs-7 breadcrumb-bridal">
            <li class="breadcrumb-item"><a th:href="@{/customer/home}" class="text-decoration-none text-muted">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/customer/categories}" class="text-decoration-none text-muted">Danh mục</a></li>
            <li class="breadcrumb-item active text-dark fw-medium" aria-current="page" th:text="${currentCategory.categoryName}">Tên danh mục</li>
        </ol>
    </nav>
    <h2 class="serif-font fw-bold fs-2 text-capitalize category-title-border py-1" th:text="${currentCategory.categoryName}">Váy Cưới Đuôi Cá</h2>
</div>

<!-- Vùng hiển thị danh sách sản phẩm thiết kế -->
<main class="container my-5" style="min-height: 55vh;">
    <div class="row g-4">

        <!-- Lặp danh sách bộ sưu tập váy -->
        <div class="col-xl-3 col-lg-4 col-md-6" th:each="p : ${products}">
            <div class="product-card">
                <div class="product-img-box">
                    <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?q=80&w=400'}"
                         class="product-img" th:alt="${p.productName}">

                    <!-- Lớp phủ nút tương tác nhanh mượt mà -->
                    <div class="product-action-overlay">
                        <a th:href="@{/customer/products/{id}(id=${p.productId})}" class="btn btn-action-custom btn-view-detail d-flex align-items-center justify-content-center">
                            <i class="fa-regular fa-eye me-2"></i> Chi tiết
                        </a>
                        <!-- CHỈNH SỬA: Thêm class 'ajax-cart-form' để JS chặn load trang -->
                        <form th:action="@{/customer/cart/add}" method="POST" class="flex-grow-1 m-0 ajax-cart-form">
                            <input type="hidden" name="productId" th:value="${p.productId}">
                            <button type="submit" class="btn btn-action-custom btn-add-cart w-100 h-100">
                                <i class="fa-solid fa-bag-shopping me-2"></i> + Giỏ hàng
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Khối thông tin sản phẩm -->
                <div class="product-info">
                    <h3 class="product-name" th:text="${p.productName}">Váy Cưới Luxury Hoàng Gia</h3>
                    <p class="product-price m-0" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">18,500,000 VNĐ</p>
                </div>
            </div>
        </div>

        <!-- Trạng thái trống khi chưa có thiết kế nào thuộc danh mục này -->
        <div class="col-12 text-center py-5" th:if="${#lists.isEmpty(products)}">
            <div class="empty-showcase-box mx-auto" style="max-width: 500px;">
                <i class="fa-solid fa-wand-magic-sparkles fs-3 mb-3 opacity-50 d-block" style="color: var(--bridal-gold);"></i>
                <p class="text-muted small">Các thiết kế cao cấp cho danh mục này hiện đang được nghệ nhân chuẩn bị trưng bày.</p>
                <a th:href="@{/customer/categories}" class="btn btn-xs btn-outline-dark mt-2 px-4 py-2 rounded-0 text-uppercase small tracking-widest" style="font-size: 0.7rem;">
                    Quay lại bộ sưu tập
                </a>
            </div>
        </div>

    </div>
</main>

<!-- Nhúng Chân Trang chung -->
<div th:replace="~{customer/fragments/layout :: customer-footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- SCRIPT XỬ LÝ AJAX THÊM GIỎ HÀNG KHÔNG REFRESH TRANG -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const cartForms = document.querySelectorAll('.ajax-cart-form');
        const toast = document.getElementById('bellaCartToast');
        // 🌟 Tìm thẻ hiển thị số lượng trên thanh Navbar
        const cartBadge = document.getElementById('cart-badge-count');

        cartForms.forEach(form => {
            form.addEventListener('submit', function (e) {
                e.preventDefault();

                const formData = new FormData(this);
                const searchParams = new URLSearchParams();
                for (const pair of formData) {
                    searchParams.append(pair[0], pair[1]);
                }

                fetch(this.action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: searchParams
                })
                // Thay vì chỉ check response.ok, ta đọc luôn dữ liệu text con số trả về
                .then(async response => {
                    if (response.status === 401) {
                        alert("Vui lòng đăng nhập để thêm sản phẩm vào giỏ hàng nha nàng!");
                        window.location.href = "/login";
                        return;
                    }

                    if (response.ok) {
                        const newCartCount = await response.text(); // 🌟 Đọc tổng số lượng thực tế từ Backend gửi về

                        // 🌟 CẬP NHẬT LÊN NAVBAR REALTIME
                        if (cartBadge) {
                            cartBadge.innerText = newCartCount;
                        }

                        // Hiện hiệu ứng toast lung linh báo thành công
                        toast.classList.add('show');
                        setTimeout(() => {
                            toast.classList.remove('show');
                        }, 2500);
                    } else {
                        alert("Có lỗi xảy ra, nàng vui lòng thử lại sau!");
                    }
                })
                .catch(error => {
                    console.error("Lỗi hệ thống:", error);
                });
            });
        });
    });
</script>
</body>
</html>
