<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${currentCategory.categoryName} + ' - Bella Couture'">Sản phẩm - Bella Couture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body { background-color: #fdfbf7; font-family: 'Plus Jakarta Sans', sans-serif; color: #1a1a1a; }
        .serif-font { font-family: 'Playfair Display', serif; }

        /* Đồng bộ CSS Menu */
        .navbar-bridal { background-color: rgba(255, 255, 255, 0.95); padding: 15px 0; border-bottom: 1px solid rgba(197, 168, 128, 0.2); }
        .nav-link-bridal { font-weight: 500; font-size: 0.9rem; text-transform: uppercase; color: #1a1a1a !important; padding: 8px 16px !important; }
        .nav-link-bridal:hover { color: #c5a880 !important; }
        .nav-icon-btn { color: #1a1a1a; font-size: 1.2rem; margin-left: 15px; position: relative; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background-color: #c5a880; font-size: 0.65rem; padding: 3px 6px; }

        /* Card Sản phẩm Cao Cấp cực đẹp */
        .product-card {
            background: #ffffff;
            border: none;
            border-radius: 0;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.01);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
        }
        .product-img-box {
            position: relative;
            overflow: hidden;
            padding-top: 140%; /* Tỷ lệ vàng ảnh mẫu váy cưới đứng */
        }
        .product-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        /* Lớp phủ hành động xuất hiện mượt mà khi hover */
        .product-action-overlay {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 20px;
            background: linear-gradient(to top, rgba(255,255,255,0.95) 40%, rgba(255,255,255,0) 100%);
            display: flex;
            gap: 10px;
            transform: translateY(101%);
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .btn-action-custom {
            flex: 1;
            padding: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 0;
            transition: all 0.3s;
        }
        .btn-view-detail { background-color: #1a1a1a; color: white; border: 1px solid #1a1a1a; }
        .btn-view-detail:hover { background-color: transparent; color: #1a1a1a; }
        .btn-add-cart { background-color: #c5a880; color: white; border: 1px solid #c5a880; }
        .btn-add-cart:hover { background-color: #1a1a1a; border-color: #1a1a1a; }

        .product-info {
            padding: 20px;
            text-align: center;
        }
        .product-name {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #1a1a1a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .product-price {
            color: #c5a880;
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Hover Effect chung */
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(197, 168, 128, 0.12);
        }
        .product-card:hover .product-img {
            transform: scale(1.05);
        }
        .product-card:hover .product-action-overlay {
            transform: translateY(0);
        }
    </style>
</head>
<body>
<div th:replace="~{customer/fragments/layout :: customer-navbar}"></div>

<div class="container mt-4">
    <nav style="--bs-breadcrumb-divider: '›';" aria-label="breadcrumb">
        <ol class="breadcrumb mb-2 fs-7">
            <li class="breadcrumb-item"><a th:href="@{/customer/home}" class="text-decoration-none text-muted">Trang chủ</a></li>
            <li class="breadcrumb-item"><a th:href="@{/customer/categories}" class="text-decoration-none text-muted">Danh mục</a></li>
            <li class="breadcrumb-item active text-dark" aria-current="page" th:text="${currentCategory.categoryName}">Tên danh mục</li>
        </ol>
    </nav>
    <h2 class="serif-font fw-bold fs-1 text-capitalize border-start border-3 border-warning ps-3 py-1" th:text="${currentCategory.categoryName}">Váy Cưới Đuôi Cá</h2>
</div>

<main class="container my-5" style="min-height: 50vh;">
    <div class="row">

        <div class="col-xl-3 col-lg-4 col-md-6" th:each="p : ${products}">
            <div class="product-card">
                <div class="product-img-box">
                    <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?q=80&w=400'}"
                         class="product-img" th:alt="${p.productName}">

                    <div class="product-action-overlay">
                        <a th:href="@{/customer/products/{id}(id=${p.productId})}" class="btn btn-action-custom btn-view-detail d-flex align-items-center justify-content-center">
                            <i class="fa-regular fa-eye me-1"></i> Xem
                        </a>
                        <form th:action="@{/customer/cart/add}" method="POST" class="flex-grow-1 m-0">
                            <input type="hidden" name="productId" th:value="${p.productId}">
                            <button type="submit" class="btn btn-action-custom btn-add-cart w-100 h-100">
                                <i class="fa-solid fa-bag-shopping me-1"></i> + Giỏ
                            </button>
                        </form>
                    </div>
                </div>

                <div class="product-info">
                    <h3 class="product-name" th:text="${p.productName}">Váy Cưới Luxury Hoàng Gia</h3>
                    <p class="product-price m-0" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">18,500,000 VNĐ</p>
                </div>
            </div>
        </div>

        <div class="col-12 text-center py-5 text-muted" th:if="${#lists.isEmpty(products)}">
            <i class="fa-solid fa-wand-magic-sparkles fs-3 mb-2 opacity-50 d-block"></i>
            <p>Các thiết kế cao cấp cho danh mục này hiện đang được thiết kế trưng bày.</p>
            <a th:href="@{/customer/categories}" class="btn btn-sm btn-outline-dark mt-2 px-3 rounded-0">Quay lại danh mục</a>
        </div>

    </div>
</main>

<div th:replace="~{customer/fragments/layout :: customer-footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
