<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Mục Thiết Kế - Bella Couture</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body { background-color: #fdfbf7; font-family: 'Plus Jakarta Sans', sans-serif; color: #1a1a1a; }
        .serif-font { font-family: 'Playfair Display', serif; }

        /* Đồng bộ CSS Menu đã có của bạn */
        .navbar-bridal { background-color: rgba(255, 255, 255, 0.95); padding: 15px 0; border-bottom: 1px solid rgba(197, 168, 128, 0.2); }
        .nav-link-bridal { font-weight: 500; font-size: 0.9rem; text-transform: uppercase; color: #1a1a1a !important; padding: 8px 16px !important; }
        .nav-link-bridal:hover { color: #c5a880 !important; }
        .nav-icon-btn { color: #1a1a1a; font-size: 1.2rem; margin-left: 15px; position: relative; }
        .cart-badge { position: absolute; top: -8px; right: -8px; background-color: #c5a880; font-size: 0.65rem; padding: 3px 6px; }

        /* Hiệu ứng ô Phân Loại Category cực kỳ sinh động */
        .category-banner-card {
            position: relative;
            height: 450px;
            overflow: hidden;
            background-color: #1a1a1a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            cursor: pointer;
        }
        .category-img {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.85;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s;
        }
        .category-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 60%, rgba(0,0,0,0.85) 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 40px;
            transition: background 0.4s;
        }
        .category-title {
            font-size: 2rem;
            color: #ffffff;
            font-weight: 600;
            margin-bottom: 8px;
            transform: translateY(15px);
            transition: transform 0.5s ease;
        }
        .category-desc {
            color: #e5dfd5;
            font-size: 0.9rem;
            opacity: 0;
            transform: translateY(20px);
            transition: transform 0.5s ease, opacity 0.4s ease;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .category-btn {
            color: #c5a880;
            text-transform: uppercase;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            margin-top: 15px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
            text-decoration: none;
        }

        /* Kích hoạt Hover sinh động */
        .category-banner-card:hover .category-img {
            transform: scale(1.08);
            opacity: 0.7;
        }
        .category-banner-card:hover .category-title {
            transform: translateY(0);
        }
        .category-banner-card:hover .category-desc {
            opacity: 1;
            transform: translateY(0);
        }
        .category-banner-card:hover .category-btn {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div th:replace="~{customer/fragments/layout :: customer-navbar}"></div>

<div class="py-5 bg-white text-center border-bottom border-light">
    <span class="text-uppercase tracking-wider text-muted small d-block mb-2">- THƯƠNG HIỆU THỜI TRANG CƯỚI -</span>
    <h1 class="serif-font fw-bold text-dark display-5">Danh Mục Thiết Kế</h1>
    <p class="text-muted max-w-md mx-auto small">Lựa chọn kiểu dáng váy phù hợp để nàng trở thành đóa hoa rực rỡ nhất trong ngày hạnh phúc</p>
</div>
<main class="container section-padding my-5">
    <div class="row">

        <div class="col-lg-4 col-md-6" th:each="cat : ${categories}">

            <div class="category-banner-card" th:onclick="|window.location.href='@{/customer/categories/{id}(id=${cat.categoryId})}'|">

                <img src="https://images.unsplash.com/photo-1594552072238-b8a33785b261?q=80&w=600" class="category-img" th:alt="${cat.categoryName}">

                <div class="category-overlay">
                    <h2 class="category-title serif-font" th:text="${cat.categoryName}">Váy Cưới Đuôi Cá</h2>
                    <p class="category-desc" th:text="${cat.description}">Tôn vinh đường cong quyến rũ, kiêu sa tuyệt đối cho nàng dâu.</p>
                    <span class="category-btn">Xem bộ sưu tập <i class="fa-solid fa-arrow-right-long ms-1"></i></span>
                </div>
            </div>
        </div>

        <div class="col-12 text-center py-5 text-muted" th:if="${#lists.isEmpty(categories)}">
            <i class="fa-solid fa-folder-open fs-2 mb-3 d-block opacity-50"></i>
            <p>Hệ thống danh mục thiết kế đang được chuẩn bị cập nhật.</p>
        </div>

    </div>
</main>


<div th:replace="~{customer/fragments/layout :: customer-footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
