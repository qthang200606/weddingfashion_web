<div class="appointment-card d-flex flex-column flex-md-row justify-content-between align-items-md-center" th:each="app : ${appointments}">
    <div>
        <div class="d-flex align-items-center gap-2 mb-2">
            <span class="fw-bold fs-5 serif-font text-dark"
                  th:text="${#temporals.format(app.appointmentDate, 'HH:mm - dd/MM/yyyy')}">Thời gian</span>

            <span th:if="${app.status == 'PENDING'}" class="badge badge-pending px-2 py-1 small rounded">Chờ duyệt</span>
            <span th:if="${app.status == 'CONFIRMED'}" class="badge badge-confirmed px-2 py-1 small rounded">Đã xác nhận lịch</span>
            <span th:if="${app.status == 'CANCELLED'}" class="badge badge-cancelled px-2 py-1 small rounded">Đã hủy</span>
        </div>
        <div class="text-muted small">
            <p class="m-0">
                <i class="fa-regular fa-user me-1"></i> Người hẹn: <span class="text-dark fw-medium" th:text="${app.user.fullName}">Họ tên</span>
                | <i class="fa-solid fa-phone me-1"></i>
                <span th:text="${app.user.phone}">SĐT</span>
            </p>
            <p class="m-0 mt-1" th:if="${app.note != null && app.note != ''}">
                <i class="fa-regular fa-comment-dots me-1"></i> Ghi chú: <span th:text="${app.note}">Nội dung</span>
            </p>
        </div>
    </div>

    <div class="mt-3 mt-md-0" th:if="${app.status == 'PENDING' || app.status == 'CONFIRMED'}">
        <form th:action="@{/appointments/cancel/{id}(id=${app.appointmentId})}" method="post" onsubmit="return confirm('Nàng có chắc chắn muốn hủy lịch hẹn thử váy này không?');">
            <button type="submit" class="btn btn-sm btn-outline-danger px-3"><i class="fa-regular fa-calendar-times"></i> Hủy lịch</button>
        </form>
    </div>
</div>
